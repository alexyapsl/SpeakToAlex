<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpeakToAlex</title>
    <meta name="description" content="Leave Alex a message. Urgent requests are routed to WhatsApp." />
    <!-- Set this after deploying the Cloudflare Worker. -->
    <meta name="speaktoalex-api" content="https://speaktoalex-route.alexyapsl.workers.dev/route" />
    <!-- Optional: set to enable Cloudflare Turnstile. -->
    <meta name="turnstile-site-key" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=chat3" />
  </head>
  <body>
    <main class="card">
      <h1>SpeakToAlex</h1>
      <p class="intro">
        Leave a short request. The assistant may ask a couple of quick follow-up questions;
        if it is genuinely urgent, you'll get a direct WhatsApp line to Alex.
      </p>

      <div id="thread" class="thread" aria-live="polite"></div>

      <form id="chat-form" class="chat-form">
        <textarea
          id="message"
          name="message"
          maxlength="4000"
          rows="2"
          required
          placeholder="Example: Samsung Shop checkout payment is failing for multiple users..."
        ></textarea>
        <button id="submit" type="submit">Send</button>
      </form>
      <div id="turnstile-slot" class="turnstile-slot"></div>

      <p class="fine-print">Please don’t include passwords, API keys, or other secrets.</p>
    </main>

    <script src="./app.js?v=chat3" type="module"></script>
  </body>
</html>
